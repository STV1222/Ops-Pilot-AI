spring:
  application:
    name: opspilot-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${SPRING_DATASOURCE_USERNAME:opspilot}
    password: ${SPRING_DATASOURCE_PASSWORD:opspilot}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}

security:
  jwt-secret: ${JWT_SECRET:dev-secret}

ai:
  openrouter:
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    http-referer: ${OPENROUTER_HTTP_REFERER:http://localhost:3000}
    app-name: ${OPENROUTER_APP_NAME:OpsPilot AI}
