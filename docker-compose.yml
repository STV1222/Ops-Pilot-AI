services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    dns:
      - 8.8.8.8
      - 1.1.1.1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-opspilot}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-opspilot}
      - POSTGRES_SEEDS=postgres
    depends_on:
      - postgres
    ports:
      - "7233:7233"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  temporal-ui:
    image: temporalio/ui:2.30.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal
    dns:
      - 8.8.8.8
      - 1.1.1.1

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
      - redis
      - temporal
    ports:
      - "8080:8080"
    volumes:
      - ./skills:/skills
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-opspilot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-opspilot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
      SPRING_DATA_REDIS_HOST: redis
      TEMPORAL_TARGET: temporal:7233
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-OpsPilot AI}
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  pg_data:
